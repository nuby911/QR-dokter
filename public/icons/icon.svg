<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7c2d12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Inner Soft Border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#fed7aa" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Medical Cross / QR Code Synthesis -->
  <!-- Center Cross -->
  <rect x="216" y="128" width="80" height="256" rx="20" fill="#ffffff"/>
  <rect x="128" y="216" width="256" height="80" rx="20" fill="#ffffff"/>

  <!-- Core QR Finder Targets in Four Corners -->
  <!-- Top Left Finder Target -->
  <rect x="112" y="112" width="80" height="80" rx="16" fill="none" stroke="#ffffff" stroke-width="12"/>
  <rect x="136" y="136" width="32" height="32" rx="8" fill="#ffffff"/>

  <!-- Top Right Finder Target -->
  <rect x="320" y="112" width="80" height="80" rx="16" fill="none" stroke="#ffffff" stroke-width="12"/>
  <rect x="344" y="136" width="32" height="32" rx="8" fill="#ffffff"/>

  <!-- Bottom Left Finder Target -->
  <rect x="112" y="320" width="80" height="80" rx="16" fill="none" stroke="#ffffff" stroke-width="12"/>
  <rect x="136" y="344" width="32" height="32" rx="8" fill="#ffffff"/>

  <!-- Center Accent Microdot -->
  <circle cx="256" cy="256" r="16" fill="#ea580c"/>
</svg>
